name: Integración continua

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-quality:
    name: Calidad Node y TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint:node

      - name: Ejecutar typecheck
        run: npm run typecheck:node

      - name: Ejecutar pruebas
        run: npm run test:node

      - name: Construir workspaces
        run: npm run build

  python-quality:
    name: Calidad Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/recommendation-service
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar Ruff
        run: python -m ruff check .

      - name: Verificar formato Python
        run: python -m ruff format --check .

      - name: Ejecutar Mypy
        run: python -m mypy src tests

      - name: Ejecutar Pytest
        run: python -m pytest -q

  infrastructure-contract:
    name: Contrato de Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose config --quiet
